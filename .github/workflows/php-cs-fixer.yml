---
name: code style

permissions:
  contents: read

on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".dockerignore"
      - ".editorconfig"
      - ".git-blame-ignore-revs"
      - ".gitattributes"
      - ".github/CONTRIBUTING.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SECURITY.md"
      - ".gitignore"
      - ".gitlab-ci.yml"
      - "code-of-conduct.md"
      - "docs/**"
      - "framework/.gitignore"
      - "framework/.phpstorm.meta.php"
      - "framework/CHANGELOG.md"
      - "framework/LICENSE.md"
      - "framework/README.md"
      - "framework/UPGRADE.md"
      - "framework/UPGRADE-22.md"
      - "eslint.config.js"
      - "LICENSE.md"
      - "README.md"
      - "ROADMAP.md"

  push: *ignore-paths

jobs:
  php-cs-fixer:
    uses: yiisoft/yii2-actions/.github/workflows/php-cs-fixer.yml@d90cdb5bb58df697c808bb66928864f574c6d07b # master
    with:
      configuration: .php-cs-fixer.dist.php
      php-version: '["8.3"]'
