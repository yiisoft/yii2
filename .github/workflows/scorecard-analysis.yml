---
name: OpenSSF Scorecard supply-chain security

on:
  branch_protection_rule:
  push:
    branches:
      - master
  schedule:
    - cron: '30 1 * * 6'

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      contents: read # Required to check out the repository.
      id-token: write # Required to sign published results with the GitHub OIDC token.
      security-events: write # Required to upload SARIF results to code scanning.
    uses: yiisoft/yii2-actions/.github/workflows/scorecard.yml@2b3b3497b6d88911a3cd5b3b48ebcf322b9d0dc7 # master
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
