---
name: ci-oracle

permissions:
  contents: read

on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".dockerignore"
      - ".editorconfig"
      - ".git-blame-ignore-revs"
      - ".gitattributes"
      - ".github/CONTRIBUTING.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SECURITY.md"
      - ".gitignore"
      - ".gitlab-ci.yml"
      - "code-of-conduct.md"
      - "docs/**"
      - "framework/.gitignore"
      - "framework/.phpstorm.meta.php"
      - "framework/CHANGELOG.md"
      - "framework/LICENSE.md"
      - "framework/README.md"
      - "framework/UPGRADE.md"
      - "eslint.config.js"
      - "LICENSE.md"
      - "README.md"
      - "ROADMAP.md"

  push: *ignore-paths

jobs:
  tests:
    name: Oracle tests with coverage
    uses: yiisoft/yii2-actions/.github/workflows/database.yml@master
    with:
      composer-root-version: 2.0.x-dev
      concurrency-group: oracle-${{ github.ref }}
      coverage-driver: xdebug
      database-env: '{"ORACLE_PASSWORD":"oracle"}'
      database-health-cmd: "healthcheck.sh"
      database-health-retries: 10
      database-image: gvenzl/oracle-free
      database-port: "1521"
      database-type: oracle
      database-versions: '["slim-faststart"]'
      extensions: curl, intl, oci8, pdo, pdo_oci
      hook: docker exec -i database sqlplus -s system/oracle@//localhost/FREE < tests/data/oci/optimize_for_tests.sql
      os: '["ubuntu-22.04"]'
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[7.4, 8.6]"
      phpunit-group: oci
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pdo-oci-php86:
    name: Diagnose PDO_OCI on PHP 8.6
    if: github.ref_name == 'support-php86' || github.head_ref == 'support-php86'
    runs-on: ubuntu-22.04
    steps:
      - name: Set up PHP and Oracle Instant Client.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.6"
          extensions: oci8, pdo
          coverage: none

      - name: Build the released PDO_OCI and verify the driver.
        shell: bash
        run: |
          php -v
          php --ri oci8
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 6 ? 0 : 1);'
          phpize --version

          client="${ORACLE_INSTANT_CLIENT:-/opt/oracle/instantclient}"
          test -f "$client/sdk/include/oci.h"
          export LD_LIBRARY_PATH="$client${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          build_dir=$(mktemp -d "${RUNNER_TEMP}/pdo-oci.XXXXXX")
          trap 'rm -rf "$build_dir"' EXIT
          cd "$build_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://pecl.php.net/get/pdo_oci-1.2.0.tgz --output pdo_oci.tgz
          tar -xzf pdo_oci.tgz
          cd pdo_oci-1.2.0

          phpize
          if ! ./configure --with-php-config="$(command -v php-config)" --with-pdo-oci="instantclient,$client"; then
            if [[ -f config.log ]]; then cat config.log; fi
            exit 1
          fi
          make -j2 V=1

          php_args=(-n)
          if ! php -n -r 'exit(class_exists("PDO") ? 0 : 1);'; then
            php_args+=(-d "extension=$(php-config --extension-dir)/pdo.so")
          fi
          php "${php_args[@]}" -r 'exit(extension_loaded("pdo_oci") ? 1 : 0);'
          php_args+=(-d "extension=$PWD/modules/pdo_oci.so")
          php "${php_args[@]}" --ri pdo_oci
          php "${php_args[@]}" -r '$drivers = PDO::getAvailableDrivers();
            echo json_encode($drivers), PHP_EOL;
            exit(in_array("oci", $drivers, true) ? 0 : 1);'
