---
name: build-node

permissions:
  contents: read

on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".dockerignore"
      - ".editorconfig"
      - ".git-blame-ignore-revs"
      - ".gitattributes"
      - ".github/CONTRIBUTING.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/SECURITY.md"
      - ".gitignore"
      - ".gitlab-ci.yml"
      - "code-of-conduct.md"
      - "docs/**"
      - "framework/.gitignore"
      - "framework/.phpstorm.meta.php"
      - "framework/CHANGELOG.md"
      - "framework/LICENSE.md"
      - "framework/README.md"
      - "framework/UPGRADE.md"
      - "LICENSE.md"
      - "README.md"
      - "ROADMAP.md"

  push: *ignore-paths

env:
  COMPOSER_ROOT_VERSION: 2.0.x-dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: NPM 10 on ubuntu-22.04

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP with Composer.
        uses: yiisoft/yii2-actions/actions/php-setup@d90cdb5bb58df697c808bb66928864f574c6d07b # master
        with:
          composer-root-version: 2.0.x-dev
          coverage-driver: none
          php-version: 8.3

      - name: Install JQuery `3.6.*@stable` for tests.
        run: composer require "bower-asset/jquery:3.6.*@stable"

      - name: Install node.js.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Tests.
        run: |
          npm install
          npm run lint
          npm test
